amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.1
    max_beams: 60

    min_particles: 500
    max_particles: 2000

    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1
    transform_tolerance: 1.0

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
